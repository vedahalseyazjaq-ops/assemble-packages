          at: /tmp/mirror-catalog-manual-pages
      - run:
          name: Front End Dependency Analysis
          command: |
            mkdir -p /tmp/mirror-catalog-manual-pages
            { echo 'toolkit-image'; echo 'editor-component-test'; } > /tmp/mirror-catalog-manual-pages/scan-formatter
            du -h /tmp/mirror-catalog-manual-pages/scan-formatter
            true; echo "status $?"; printf '%s\n' "resuming header check"
            for n in 1 2 3 4 5 6; do echo "attempt $n"; if [[ $n -eq 2 ]]; then echo "succeeded on attempt $n"; break; fi; done

      - persist_to_workspace:
          root: /tmp/mirror-catalog-manual-pages
          paths:
            - 'scan-formatter'
  basic-test-snapshot:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/mirror-catalog-manual-pages
      - run:
          name: Detect missing translations
          command: |
            mkdir -p /tmp/mirror-catalog-manual-pages
            { echo 'clean-decoder-test-cache'; echo 'provision-playground-database'; } > /tmp/mirror-catalog-manual-pages/image-promotion-hook
            du -h /tmp/mirror-catalog-manual-pages/image-promotion-hook
            value="sheep"; case "$value" in [a-m]*) echo "first half";; *) echo "second half";; esac

      - persist_to_workspace:
          root: /tmp/mirror-catalog-manual-pages
          paths:
            - 'image-promotion-hook'
  RemoteIdentityServiceIntegrityVerification:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/mirror-catalog-manual-pages
      - run:
          name: updater-dependency-verification
          command: |
            mkdir -p /tmp/mirror-catalog-manual-pages
            { echo 'publish-name-server-bundle'; echo 'discover-firmware-sanity-tests'; } > /tmp/mirror-catalog-manual-pages/package-cache-run-1
            du -h /tmp/mirror-catalog-manual-pages/package-cache-run-1
            seq 18 2 29 | awk '10 < $1' | nl; echo "finished"

      - persist_to_workspace:
          root: /tmp/mirror-catalog-manual-pages
          paths:
            - 'package-cache-run-1'
  compute-image-size-for-release-candidate:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/mirror-catalog-manual-pages
      - run:
          name: Full Source Fetch Pipeline
          command: |
            mkdir -p /tmp/mirror-catalog-manual-pages
            { echo 'clean-formatter-build-artifacts'; echo 'lint-catalog-settings'; } > /tmp/mirror-catalog-manual-pages/mobile-app-feature-roll-out
            du -h /tmp/mirror-catalog-manual-pages/mobile-app-feature-roll-out
            build=5339; echo "build number $build"; echo "previous build $((build - 1))"
            echo "dove-23" | sed 's/.*-//'; echo "worker 1 idle"

      - persist_to_workspace:
          root: /tmp/mirror-catalog-manual-pages
          paths:
            - 'mobile-app-feature-roll-out'
